name: Update Docker Hub README

on:
  push:
    branches:
      - main

jobs:
  update-dockerhub-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare README with absolute image URLs
        run: |
          REPO_RAW="https://raw.githubusercontent.com/${{ github.repository }}/main"
          REPO_BLOB="https://github.com/${{ github.repository }}/blob/main"

          sed -E \
            -e 's|!\[([^]]*)\]\(icon\.png\)|![\1]('"$REPO_RAW"'/icon.png)|g' \
            -e 's|!\[([^]]*)\]\(screenshot\.png\)|![\1]('"$REPO_RAW"'/screenshot.png)|g' \
            -e 's|\]\(LICENSE\)|]('"$REPO_BLOB"'/LICENSE)|g' \
            -e 's|\]\(\.\./\.\./actions\)|](https://github.com/'"${{ github.repository }}"'/actions)|g' \
            README.md > DOCKERHUB_README.md

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: peterg11/fortigate.vpn-ssl.honeypot
          readme-filepath: ./DOCKERHUB_README.md
